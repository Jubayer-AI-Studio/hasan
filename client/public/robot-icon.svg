<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#070814"/>
    </linearGradient>

    <!-- Pearl Ceramic Body Gradient -->
    <linearGradient id="ceramic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Glass Visor Face Gradient -->
    <linearGradient id="visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Neon Glow Eyes Cyan -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00DFD8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Rounded Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#00DFD8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Antenna with Glowing Orb -->
  <rect x="250" y="80" width="12" height="50" rx="6" fill="#94A3B8"/>
  <circle cx="256" cy="75" r="18" fill="url(#cyanGlow)" filter="url(#glow)"/>

  <!-- Robot Head Ceramic -->
  <rect x="136" y="125" width="240" height="185" rx="50" fill="url(#ceramic)"/>

  <!-- Cute Ears with Glowing Core -->
  <rect x="110" y="180" width="28" height="56" rx="14" fill="#E2E8F0"/>
  <circle cx="124" cy="208" r="8" fill="#00DFD8" filter="url(#glow)"/>
  <rect x="374" y="180" width="28" height="56" rx="14" fill="#E2E8F0"/>
  <circle cx="388" cy="208" r="8" fill="#00DFD8" filter="url(#glow)"/>

  <!-- Glossy Black OLED Visor Face -->
  <rect x="160" y="145" width="192" height="135" rx="35" fill="url(#visor)"/>

  <!-- Visor Top Glass Reflection Line -->
  <path d="M 180 160 Q 256 150 332 160" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Left Anime Smiling Eye -->
  <path d="M 185 205 Q 210 178 235 205" stroke="#00DFD8" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Right Anime Smiling Eye -->
  <path d="M 277 205 Q 302 178 327 205" stroke="#00DFD8" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Glowing Blushing Cheeks -->
  <ellipse cx="190" cy="240" rx="14" ry="7" fill="#F43F5E" fill-opacity="0.75" filter="url(#glow)"/>
  <ellipse cx="322" cy="240" rx="14" ry="7" fill="#F43F5E" fill-opacity="0.75" filter="url(#glow)"/>

  <!-- Cute Animated Smiling Mouth -->
  <path d="M 240 236 Q 256 250 272 236" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Robot Ceramic Body -->
  <rect x="176" y="325" width="160" height="110" rx="42" fill="url(#ceramic)"/>

  <!-- Body Core Gem / Chest Light -->
  <circle cx="256" cy="370" r="18" fill="url(#cyanGlow)" filter="url(#glow)"/>

  <!-- Waving Hands -->
  <circle cx="140" cy="355" r="22" fill="url(#ceramic)"/>
  <circle cx="372" cy="355" r="22" fill="url(#ceramic)"/>

  <!-- Floating Thrusters Jet Rings -->
  <ellipse cx="225" cy="445" rx="18" ry="8" fill="#00DFD8" filter="url(#glow)"/>
  <ellipse cx="287" cy="445" rx="18" ry="8" fill="#00DFD8" filter="url(#glow)"/>
</svg>
